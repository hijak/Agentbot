# Fork-friendly releases: builds unsigned desktop packages for macOS
# (arm64 + x64), Windows x64, and Ubuntu x64 from ONE pinned commit and
# assembles a draft GitHub release in THIS repository.
#
# What was removed vs upstream:
#   - No Apple Developer ID signing / notarization / stapling (needs paid
#     Apple secrets). macOS builds are unsigned: users open them with
#     right-click -> Open on first launch.
#   - No legacy updater mirror (milind-soni/agentbot-releases), no RELEASES_PAT.
#   - No npm / Docker publishes on release.
#   - No hardcoded milind-soni/Agentbot owner checks: the updater target is
#     derived from $GITHUB_REPOSITORY, so this works on any fork as long as
#     package.json's repository URL points at it (electron-builder infers the
#     publish owner/repo from there).
#
# Flow: Actions -> Prepare next release -> merge the version-bump PR (or Run
# workflow manually with publish ticked) -> review the draft -> publish.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string
      publish:
        description: "Publish immediately after assembly (otherwise leave a draft for review)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      should_release: ${{ steps.pin.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: pin
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          current=$(node -p "require('./package.json').version")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          should_release=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git cat-file -e "$BEFORE:package.json" 2>/dev/null || {
              echo "::error::cannot verify the version before this push; refusing to start a release"
              exit 1
            }
            previous=$(git show "$BEFORE:package.json" | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).version))')
            if [ "$previous" = "$current" ]; then
              echo "package.json changed without a version bump; skipping the release"
              should_release=false
            fi
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published release
        if: steps.pin.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$v is already published on $GITHUB_REPOSITORY — bump the version first"
            exit 1
          fi

  mac:
    name: macOS arm64 + x64 (unsigned)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release

      - name: Package both architectures (unsigned)
        env:
          # No Apple signing identity in a fork: build unsigned instead of
          # failing the identity search.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:mac

      - name: "Gate: both packaged apps point their updater at this repo"
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          for app in release/mac-arm64/Agentbot.app release/mac/Agentbot.app; do
            update="$app/Contents/Resources/app-update.yml"
            test -f "$update" || { echo "::error::missing $update"; exit 1; }
            grep -Eq "^owner: $owner$" "$update" || { echo "::error::wrong update owner in $update (want $owner)"; cat "$update"; exit 1; }
            grep -Eq "^repo: $repo$" "$update" || { echo "::error::wrong update repo in $update (want $repo)"; cat "$update"; exit 1; }
          done

      - name: "Gate: both packaged servers start and every helper path resolves"
        run: |
          for app in release/mac-arm64/Agentbot.app release/mac/Agentbot.app; do
            res="$app/Contents/Resources"
            # the server tree is plain JS — runnable on the runner's node
            # regardless of the app binary's arch
            AGENTBOT_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
            node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, p]) => !existsSync(p));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} proxies resolve in ${server}`);
          EOF
          done

      - name: Stable-named copies for the README's /latest/download links
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Agentbot-$v-arm64.dmg" release/Agentbot.dmg
          cp "release/Agentbot-$v-x64.dmg" release/Agentbot-intel.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - run: pnpm package:win
      - name: "Gate: bundled browser works with an empty home"
        run: node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release/win-unpacked/resources"
      - name: "Gate: packaged Windows server discovers its browser"
        env:
          AGENTBOT_SMOKE_DIST: ${{ github.workspace }}/release/win-unpacked/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release/win-unpacked/resources/browser-engine"
      - name: Verify the packaged tree and start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
          grep -Eq "^owner: $owner$" "$res/app-update.yml" || { echo "::error::wrong update owner (want $owner)"; exit 1; }
          grep -Eq "^repo: $repo$" "$res/app-update.yml" || { echo "::error::wrong update repo (want $repo)"; exit 1; }
          if grep -q "publisherName" "$res/app-update.yml"; then
            echo "::error::publisherName on an unsigned build breaks every update"; exit 1
          fi
          HOME="$RUNNER_TEMP/smoke" USERPROFILE="$RUNNER_TEMP/smoke" AGENTBOT_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1 && { kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1
      - name: Stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Agentbot-$v-setup.exe" release/Agentbot-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Ubuntu 24.04 x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: pnpm clean
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - run: pnpm package:linux
      - name: Verify package contents and metadata
        # verify-linux-package.mjs reads the expected updater owner/repo from
        # package.json's repository URL, so forks check against themselves.
        run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: "Gate: installed browser works with Ubuntu sandbox restrictions"
        run: node scripts/smoke-browser-bundle.mjs --resources /opt/Agentbot/resources
      - name: "Gate: packaged Linux server discovers its browser"
        env:
          AGENTBOT_SMOKE_DIST: /opt/Agentbot/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle /opt/Agentbot/resources/browser-engine
      - name: Smoke the packages
        env:
          AGENTBOT_KEEP_SMOKE_DIR: "1"
          AGENTBOT_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge agentbot || true
      - name: Stable-named copies and checksums
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Agentbot-$v-amd64.deb" release/Agentbot-amd64.deb
          cp "release/Agentbot-$v-x86_64.AppImage" release/Agentbot.AppImage
          (cd release && sha256sum Agentbot-$v-amd64.deb Agentbot-$v-x86_64.AppImage > SHA256SUMS-ubuntu-x64.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-ubuntu-x64.txt
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble the draft and verify every feed
    needs: [prepare, mac, windows, linux]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-v${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Refuse an incomplete installer or updater set
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          required=(
            latest-linux.yml latest-mac.yml latest.yml
            "Agentbot-$VERSION-amd64.deb"
            "Agentbot-$VERSION-arm64.dmg"
            "Agentbot-$VERSION-arm64.dmg.blockmap"
            "Agentbot-$VERSION-arm64.zip"
            "Agentbot-$VERSION-arm64.zip.blockmap"
            "Agentbot-$VERSION-setup.exe"
            "Agentbot-$VERSION-setup.exe.blockmap"
            "Agentbot-$VERSION-x64.dmg"
            "Agentbot-$VERSION-x64.dmg.blockmap"
            "Agentbot-$VERSION-x64.zip"
            "Agentbot-$VERSION-x64.zip.blockmap"
            "Agentbot-$VERSION-x86_64.AppImage"
            Agentbot-amd64.deb Agentbot-intel.dmg Agentbot-setup.exe
            Agentbot.AppImage Agentbot.dmg SHA256SUMS-ubuntu-x64.txt
          )
          for file in "${required[@]}"; do
            test -s "assets/$file" || { echo "::error::missing or empty release asset: $file"; exit 1; }
          done
          test "$(find assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "${#required[@]}" || {
            echo "::error::unexpected release asset set"; find assets -maxdepth 1 -type f -print; exit 1; }
      - name: Verify every feed hash against the actual bytes
        run: |
          cd assets
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, statSync } from "node:fs";
          const sha512 = (f) => createHash("sha512").update(readFileSync(f)).digest("base64");
          const expected = new Map([
            ["latest-mac.yml", [
              "Agentbot-${{ needs.prepare.outputs.version }}-x64.zip",
              "Agentbot-${{ needs.prepare.outputs.version }}-arm64.zip",
              "Agentbot-${{ needs.prepare.outputs.version }}-x64.dmg",
              "Agentbot-${{ needs.prepare.outputs.version }}-arm64.dmg",
            ]],
            ["latest.yml", ["Agentbot-${{ needs.prepare.outputs.version }}-setup.exe"]],
            ["latest-linux.yml", [
              "Agentbot-${{ needs.prepare.outputs.version }}-x86_64.AppImage",
              "Agentbot-${{ needs.prepare.outputs.version }}-amd64.deb",
            ]],
          ]);
          let bad = 0;
          for (const [feed, expectedUrls] of expected) {
            const text = readFileSync(feed, "utf8");
            const entries = [...text.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)];
            const urls = entries.map(([, url]) => url).sort();
            if (JSON.stringify(urls) !== JSON.stringify([...expectedUrls].sort())) {
              console.error(`WRONG PATHS in ${feed}: ${urls.join(", ") || "none"}`);
              bad++;
              continue;
            }
            for (const [, url, hash, size] of entries) {
              const okHash = sha512(url) === hash;
              const okSize = statSync(url).size === Number(size);
              if (!okHash || !okSize) { console.error(`MISMATCH ${url} in ${feed}`); bad++; }
              else console.log(`ok ${url}`);
            }
          }
          if (bad) process.exit(1);
          console.log(`\nall feeds verified; ${readdirSync(".").length} assets staged`);
          EOF
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          tag="v$VERSION"
          ensure_draft() {
            local repo=$1
            shift
            local attempt delay
            for attempt in 1 2 3 4 5; do
              gh release view "$tag" --repo "$repo" > /dev/null 2>&1 && return 0
              if gh release create "$tag" --repo "$repo" "$@"; then
                return 0
              fi
              # The API can create the release before a transient response
              # failure reaches gh. Recover that success before retrying.
              gh release view "$tag" --repo "$repo" > /dev/null 2>&1 && return 0
              test "$attempt" -lt 5 || {
                echo "::error::could not create $tag in $repo after $attempt attempts"
                return 1
              }
              delay=$((5 << (attempt - 1)))
              echo "::warning::release creation failed for $repo; retrying in ${delay}s ($attempt/5)"
              sleep "$delay"
            done
          }
          ensure_draft "$GITHUB_REPOSITORY" --target "$SHA" \
            --draft --title "Agentbot $VERSION" --generate-notes
          target=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          target_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq .sha)
          test "$target_sha" = "$SHA" || {
            echo "::error::$tag draft targets $target_sha, not pinned release commit $SHA"
            exit 1
          }
          for file in assets/*; do
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
          echo "asset count: $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"

      - name: Publish (only when asked to)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -q false
          echo "v$VERSION is live on $GITHUB_REPOSITORY"
