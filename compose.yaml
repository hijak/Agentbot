name: ${COMPOSE_PROJECT_NAME:-agentbot}
services:
  omb:
    init: true
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${AGENTBOT_BASE_IMAGE:-ghcr.io/milind-soni/agentbot:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${AGENTBOT_LOCAL_IMAGE:-agentbot-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${AGENTBOT_BIND_ADDRESS:-127.0.0.1}:${AGENTBOT_HTTP_PORT:-8080}:80"
    environment:
      AGENTBOT_PORT: "8799"
      AGENTBOT_WEBHOOK_PORT: "8800"
      AGENTBOT_PUBLIC_URL: ${AGENTBOT_PUBLIC_URL:-http://localhost:${AGENTBOT_HTTP_PORT:-8080}}
      AGENTBOT_WEBHOOK_PUBLIC_URL: ${AGENTBOT_WEBHOOK_PUBLIC_URL:-${AGENTBOT_PUBLIC_URL:-http://localhost:${AGENTBOT_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('agentbot')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:omb
    environment:
      AGENTBOT_HTTPS_HOST: ${AGENTBOT_HTTPS_HOST:-}
      AGENTBOT_BIND_ADDRESS: ${AGENTBOT_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export AGENTBOT_UPSTREAM_SCHEME=http
        if [ -n "$$AGENTBOT_HTTPS_HOST" ] && [ "$$AGENTBOT_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "AGENTBOT_HTTPS_HOST requires AGENTBOT_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$AGENTBOT_HTTPS_HOST" ]; then
          export AGENTBOT_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      omb:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${AGENTBOT_DATA_EXTERNAL:-false}
    name: ${AGENTBOT_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-agentbot}_data}
  caddy_data:
  caddy_config:
