name: ${COMPOSE_PROJECT_NAME:-agentbot-podman}
services:
  omb:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/agentbot-podman:${AGENTBOT_IMAGE_TAG:-local}
    init: true
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${AGENTBOT_DATA_ROOT:?Run setup.sh first}:${AGENTBOT_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/omb-podman.sock
    environment:
      HOME: ${AGENTBOT_DATA_ROOT}
      AGENTBOT_DATA_DIR: ${AGENTBOT_DATA_ROOT}/.agentbot
      AGENTBOT_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/omb-podman.sock
      AGENTBOT_PORT: ${AGENTBOT_PORT:-8799}
      AGENTBOT_WEBHOOK_PORT: ${AGENTBOT_WEBHOOK_PORT:-8800}
      AGENTBOT_PUBLIC_URL: ${AGENTBOT_PUBLIC_URL:-http://localhost:8080}
      AGENTBOT_WEBHOOK_PUBLIC_URL: ${AGENTBOT_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$AGENTBOT_PORT/api/health | grep -q agentbot']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      omb:
        condition: service_healthy
    environment:
      AGENTBOT_HTTP_PORT: ${AGENTBOT_HTTP_PORT:-8080}
      AGENTBOT_PORT: ${AGENTBOT_PORT:-8799}
      AGENTBOT_WEBHOOK_PORT: ${AGENTBOT_WEBHOOK_PORT:-8800}
      AGENTBOT_HTTPS_HOST: ${AGENTBOT_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
